name: fieldkit
description: Offline survival reference and practical knowledge.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.12.2 <4.0.0"
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: 1.0.8
  flutter_riverpod: 3.4.3
  drift: 2.35.2
  sqlite3: 3.5.2
  path_provider: 2.1.6
  path: 1.9.1
  maplibre_gl: 0.27.1
  geolocator: 14.0.1
  html: 0.15.7
  xml: 7.0.1
  ffi: 2.2.0
  crypto: 3.0.7
  archive: 4.5.2
  connectivity_plus: 7.3.2
  flutter_svg: 2.3.0
  url_launcher: 6.3.3

  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/content/
    - assets/examples/
    - assets/i18n/
    - assets/illustrations/
    - assets/fonts/
    - path: registry/test_cases.json
      flavors:
        - development
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic.ttf
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari.ttf
    - family: NotoSansMalayalam
      fonts:
        - asset: assets/fonts/NotoSansMalayalam.ttf
    - family: NotoSansTamil
      fonts:
        - asset: assets/fonts/NotoSansTamil.ttf
    - family: NotoSansTelugu
      fonts:
        - asset: assets/fonts/NotoSansTelugu.ttf
